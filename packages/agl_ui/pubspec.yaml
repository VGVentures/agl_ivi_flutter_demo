    - assets/icon_android_auto.svg
    - assets/icon_battery_half.svg
    - assets/icon_carplay.svg
    - assets/icon_climate_sync.svg
    - assets/icon_fan.svg
    - assets/icon_home.svg
    - assets/icon_seat_heat.svg
    - assets/icon_settings_sliders.svg
    - assets/icon_shuffle.svg
    - assets/icon_skip_back.svg
    - assets/icon_skip_forward.svg
    - assets/icon_waveform.svg
    - assets/media_pause.svg
    - assets/media_play.svg
    - assets/media_repeat.svg
    - assets/media_shuffle.svg
    - assets/media_skip_next.svg
    - assets/media_skip_previous.svg
    - assets/seat_recline.svg
    - assets/cloud_dotted.svg
    - assets/drive_comfort.svg
