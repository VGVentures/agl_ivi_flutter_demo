<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="crop"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <!-- No face: the car does not know who this is, and drawing one would
       claim it does. The same head and shoulders as the drivers, left blank. -->
  <g clip-path="url(#crop)">
    <ellipse cx="60" cy="134" rx="46" ry="46" fill="#8A9097"/>
    <circle cx="60" cy="46" r="26" fill="#8A9097"/>
  </g>
</svg>
